<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lys Rose responsive audit</title><style>body{font:14px system-ui;margin:16px;background:#fff;color:#222}article{margin:24px 0}iframe{border:1px solid #bbb;transform-origin:top left}pre{white-space:pre-wrap;background:#eee;padding:12px}.preview{overflow:hidden}button{padding:12px;min-height:44px}</style><h1>Responsive audit</h1><p>Read-only layout measurements from the built website.</p><div id="results"></div><script>
const pages=['/','/about/','/services/','/faq/','/contact/'];
const sizes=[[320,568],[390,844],[768,1024],[1440,900],[844,390]];
const results=document.querySelector('#results');
for(const path of pages)for(const [width,height] of sizes){
 const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=`${path} — ${width}×${height}`;article.append(heading);
 const report=document.createElement('pre');report.textContent='Loading';article.append(report);
 const preview=document.createElement('div');preview.className='preview';
 const frame=document.createElement('iframe');frame.title=heading.textContent;frame.width=width;frame.height=height;frame.src=path;
 const scale=Math.min(1,330/width);frame.style.transform=`scale(${scale})`;preview.style.height=`${height*scale+4}px`;preview.append(frame);article.append(preview);results.append(article);
 frame.addEventListener('load',async()=>{
  const d=frame.contentDocument;await d.fonts.ready;
  const cta=d.querySelector('.header-waitlist');const r=cta.getBoundingClientRect();
  const images=[...d.querySelectorAll('.detail-image')].map(image=>{const rect=image.getBoundingClientRect();const expected=Number(image.getAttribute('width'))/Number(image.getAttribute('height'));return {file:image.getAttribute('src').split('/').pop(),renderedRatio:+(rect.width/rect.height).toFixed(3),sourceRatio:+expected.toFixed(3),preserved:Math.abs(rect.width/rect.height-expected)<.01};});
  const controls=[...d.querySelectorAll('.menu-toggle,.header-waitlist,.submit-button,.menu-close,.faq-item summary')].filter(el=>el.getClientRects().length).map(el=>({text:el.textContent.trim().slice(0,35),height:Math.round(el.getBoundingClientRect().height)}));
  const data={page:path,width,height,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,waitlistAboveFold:r.top>=0&&r.bottom<=height,waitlistFitsHorizontally:r.left>=0&&r.right<=width,images,smallControls:controls.filter(x=>x.height<44)};
  report.textContent=JSON.stringify(data,null,2);report.dataset.pass=String(data.overflow===0&&data.waitlistAboveFold&&data.waitlistFitsHorizontally&&images.every(x=>x.preserved)&&data.smallControls.length===0);
  document.title=[...document.querySelectorAll('pre')].every(x=>x.dataset.pass)?`Audit: ${[...document.querySelectorAll('pre')].filter(x=>x.dataset.pass==='true').length}/25 pass`:'Audit loading';
 });
}
</script></html>
